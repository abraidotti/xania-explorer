[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xania-explorer"
version = "0.1.0"
description = "Xania Explorer: balance reports and data checks for the Xania MUD"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "vl-convert-python>=1.6"]
site = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.setuptools.packages.find]
include = ["xania_explorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
