# Builds the xania-utils website from upstream Xania and (if it exists) your fork, then publishes it to
# GitHub Pages. Repository settings:
#   - Settings → Pages → Source: "GitHub Actions".
#   - Optional variables (Settings → Secrets and variables → Actions → Variables):
#       XANIA_FORK_REPO   fork to compare against upstream (default: <repo owner>/xania)
#       XANIA_FORK_REF    branch/tag/commit of the fork (default: its default branch)
#       XANIA_UPSTREAM_REF  upstream ref (default: main)
name: Site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # nightly, to pick up new commits in upstream and the fork
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "mattgodbolt/xania branch, tag or commit"
        default: ""
      fork_ref:
        description: "Fork branch, tag or commit (blank = default branch)"
        default: ""

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: mattgodbolt/xania
  FORK_REPO: ${{ vars.XANIA_FORK_REPO || format('{0}/xania', github.repository_owner) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out xania-utils
        uses: actions/checkout@v4
        with:
          path: xania-utils

      - name: Check out upstream Xania
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || vars.XANIA_UPSTREAM_REF || 'main' }}
          path: xania-upstream

      - name: Check out fork (skipped if it doesn't exist or isn't public)
        id: fork
        if: env.FORK_REPO != env.UPSTREAM_REPO
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ inputs.fork_ref || vars.XANIA_FORK_REF || '' }}
          path: xania-fork

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xania-utils/pyproject.toml

      - name: Install
        run: python -m pip install -e "./xania-utils[dev,site]"

      - name: Test
        working-directory: xania-utils
        env:
          XANIA_DIR: ${{ github.workspace }}/xania-upstream
        run: python -m pytest -q

      - name: Load-integrity check
        working-directory: xania-utils
        run: |
          python -m xania_utils --xania ../xania-upstream check
          if [ "${{ steps.fork.outcome }}" = "success" ]; then python -m xania_utils --xania ../xania-fork check; fi

      - name: Build site
        working-directory: xania-utils
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SITE_REPO_URL: https://github.com/${{ github.repository }}
          NO_MKDOCS_2_WARNING: "1"
        run: |
          targets=(--target "upstream=../xania-upstream")
          if [ "${{ steps.fork.outcome }}" = "success" ]; then
            targets+=(--target "fork=../xania-fork")
          else
            echo "::notice::Fork ${FORK_REPO} not available; building upstream only."
          fi
          python -m xania_utils site --strict --out ../_site "${targets[@]}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
